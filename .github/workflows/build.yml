name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testar e compilar
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Guardar telas de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas
          path: app/build/screens/*.png
          if-no-files-found: ignore

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Soberano.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Soberano 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: Soberano.apk
          make_latest: true
